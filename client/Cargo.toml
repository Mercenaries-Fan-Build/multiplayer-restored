[package]
name = "multiplayer_restored"
version = "0.6.0"
description = "Mercenaries 2 multiplayer client ASI: terminates FESL/Theater locally and talks to the multiplayer server over HTTPS"
edition = "2024"
publish = false

# Standalone package: its own workspace root. `mercs2_https` is the HTTPS client and trust policy shared with
# other ASIs, which depend on it from this repository by tag.
[workspace]
members = ["mercs2_https"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# m2-sdk.dll's bindings (mercs2_formats::mod_runtime), the PE reader and the signature scanner.
mercs2_formats = "6.0.3"
mercs2_plasma_proto = "0.1.0"
mercs2_mp_api = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
# REST client, TLS policy and the embedded CA bundle; it also vendors and pins OpenSSL 3, which the `openssl`
# dependency below shares.
mercs2_https = { path = "mercs2_https" }
openssl = "0.10"
# `SSL_ctrl(DTLS_CTRL_HANDLE_TIMEOUT)`: DTLS handshake retransmission over the relay shim's memory BIO
# (the `openssl` crate has no wrapper for `DTLSv1_handle_timeout`).
openssl-sys = "0.9"
# `ForeignTypeRef::as_ptr` on `SslRef` for that call (the trait `openssl` 0.10 implements).
foreign-types = "0.3"
# Lobby WebSocket client (RFC 6455 framing + client handshake) over the OpenSSL stream.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[dev-dependencies]
base64 = "0.22"
# `mercs2_https::testing` (test CA, one-shot TLS server) for this crate's tests only.
mercs2_https = { path = "mercs2_https", features = ["testing"] }
# The real server, started in-process by the WebSocket, relay and leaderboard integration tests.
mercs2_mp_server = "0.1.1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# TEMPORARY: replaced by the crates.io releases mercs2_formats 6.0.3, mercs2_mp_api 0.1.1 and mercs2_mp_server 0.1.1;
# delete this table then.
# mercs2_formats 6.0.3: m2-sdk 0.6.2's ref exports (m2_lua_ref handles; m2_lua_unref / m2_lua_push_ref return a status)
# and m2_lua_pop.
# mercs2_mp_api 0.1.1: the leaderboard types (rest::PushScore, rest::LeaderboardEntry, rules::LEADERBOARD_SCORE_MAX).
# mercs2_mp_server 0.1.1 (tests only): the leaderboard routes. Both from the same commit, so there is one mercs2_mp_api.
[patch.crates-io]
mercs2_formats = { git = "https://github.com/Mercenaries-Fan-Build/mercs2-wad-simulator", rev = "c105d629c9d77f8c587df8eaa66a52c1eecbcd74" }
mercs2_mp_api = { git = "https://github.com/Mercenaries-Fan-Build/multiplayer-server", rev = "51c89e4de1f4ae9c753c9dba4299a6dd4abd5de0" }
mercs2_mp_server = { git = "https://github.com/Mercenaries-Fan-Build/multiplayer-server", rev = "51c89e4de1f4ae9c753c9dba4299a6dd4abd5de0" }
