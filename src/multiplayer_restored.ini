; multiplayer_restored.ini — read by multiplayer_restored.asi from the same folder.
; Every key is required; an unknown, missing, duplicated or malformed key stops the game at start-up
; with a message naming it. Lines starting with ; or # are comments.

[server]
; The multiplayer server's HTTPS base URL. Replace with the server you play on; mp.invalid never resolves.
base_url = https://fesl.kbc.li

[fesl]
; Host names the game passes to ProtoSSLConnect for FESL. The client connects with the literal
; "fesl.ea.com" (FUN_00977370, string 0xb5fbac).
intercept_names = fesl.ea.com
; Sent to the game in the Hello reply (activityTimeoutSecs). The game drops FESL after this many seconds
; without an inbound frame.
activity_timeout_secs = 240
; The ASI pushes fsys MemCheck this often to keep that timer fed. Must be less than the timeout.
keepalive_interval_secs = 60

[theater]
; Loopback endpoint advertised as theaterIp/theaterPort; the game connects back here and the ASI serves it.
advertise_ip = 127.0.0.1
advertise_port = 14300
; Sent in the CONN reply (activityTimeoutSecs). The game drops Theater after this many seconds without an
; inbound frame.
activity_timeout_secs = 240
; The ASI pushes a Theater PING this often to keep that timer fed. Must be less than the timeout.
keepalive_interval_secs = 60
; Name of the single lobby the game is shown (LDAT NAME). All games on the server are in it.
lobby_name = Online

[messenger]
; Loopback endpoint advertised as messengerIp/messengerPort. Messenger connects are refused by design.
advertise_ip = 127.0.0.1
advertise_port = 13505

[privacy]
; Dark Souls-style room key. `none` = you see and join only public games. Any other value (6-32 letters,
; digits or '-', case-sensitive) = you see and join ONLY games hosted with exactly the same key.
room_key = none

[account]
; Shown by the game's account-creation screen (acct GetTos).
terms_of_service = Accounts on this server hold only a username and a password hash. Be decent to other players.
; Country picker for account creation (acct GetCountryList). The choice never leaves this machine.
countries = US:United States|CA:Canada|GB:United Kingdom|IE:Ireland|AU:Australia|NZ:New Zealand|DE:Germany|FR:France|ES:Spain|IT:Italy|NL:Netherlands|BE:Belgium|SE:Sweden|NO:Norway|DK:Denmark|FI:Finland|PL:Poland|BR:Brazil|MX:Mexico|JP:Japan

[http]
; Also used for the lobby WebSocket: TCP connect, then TLS + upgrade handshake.
connect_timeout_ms = 10000
io_timeout_ms = 15000

[websocket]
; The lobby WebSocket (opened at login, carries hosting/joining/browsing) is serviced on its own thread
; this often.
poll_interval_ms = 10
; If the server sends nothing (it pings every 20 s by default) for this long, the online session ends with
; a disconnect in the game. A dropped WebSocket is never silently reopened: log in again.
idle_timeout_secs = 75

[relay]
; Gameplay and voice go through the server's DTLS relay. Each other player appears to the game as a local
; address: the player in relay slot s is alias_base + s (127.0.0.2, 127.0.0.3, ...). Windows answers on all
; of 127.0.0.0/8 without configuration.
alias_base = 127.0.0.2
; UDP port each alias serves the game's ProtoTunnel on. Must differ from the game's own tunnel port
; (10000), so the alias sockets never share a port with the game's 0.0.0.0 bind. Voice uses 55123, the
; port the game hard-codes.
alias_tunnel_port = 10010
; DTLS path MTU towards the relay (handshake fragmentation).
dtls_mtu = 1200
; The DTLS handshake with the relay must finish within this, or the online game ends with an error.
handshake_timeout_ms = 10000
; Read timeout of the relay shim's sockets: how quickly it notices a stop request and sends keepalives.
poll_interval_ms = 50
; The relay ends a game's association when the server closes the game or removes a player; the lobby
; says why (game removed, kicked) on its own connection, which may arrive a moment later. If it has not
; within this long, the online game ends with an error.
close_grace_ms = 5000

[startup]
; How long to wait for SecuROM to decrypt the game code before giving up.
signature_wait_ms = 120000

[log]
; Relative to the folder this file is in.
file = multiplayer_restored.log
