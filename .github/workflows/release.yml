name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  stamp-and-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Normalise the version and read the Shipment name
        id: v
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not an X.Y.Z version"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists — pick a new version"; exit 1
          fi
          # The name is whatever the manifest says — never hard-coded. Read the `name:` inside the
          # `shipment:` block, before `contributions:` (which has `name:` fields of its own).
          NAME=$(sed -n '/^shipment:/,/^contributions:/p' manifest.yaml \
            | sed -n 's/^[[:space:]]*name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1)
          [ -n "$NAME" ] || { echo "::error::could not read shipment.name from manifest.yaml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Stamp shipment.version in manifest.yaml
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "0,/^[[:space:]]*version:/s/^\([[:space:]]*\)version:.*/\1version: $VERSION/" manifest.yaml
          got=$(sed -n 's/^[[:space:]]*version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' manifest.yaml | head -1)
          [ "$got" = "$VERSION" ] || { echo "::error::stamp failed — manifest reads '$got'"; exit 1; }

      - name: Install qm (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          # Resolve "latest" to a concrete tag ONCE, so the digest we read and the bytes we download
          # come from the same release even if a newer qm publishes mid-run.
          tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
          [ -n "$tag" ] || { echo "::error::could not resolve the latest qm release"; exit 1; }
          # GitHub records a sha256 for every release asset. Read it before downloading, so the check
          # is against what the release claims to hold rather than against the bytes that arrived.
          want=$(gh api "repos/$repo/releases/tags/$tag" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [ -n "$want" ] || { echo "::error::$asset is not in $tag"; exit 1; }
          want=${want#sha256:}
          gh release download "$tag" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::$asset failed verification — expected $want, got $got"; exit 1; }
          echo "qm $tag verified: $got"
          chmod +x qm

      # src/multiplayer_restored.asi is built from client/, not committed; the release ships the built one.
      - name: Build the client ASI
        uses: ./.github/actions/build-asi

      # The template's equivalent of "make verify": refuse to cut a release from a Shipment that does
      # not lint. Gated on the exit code, not on printed output.
      - name: Lint the Shipment before releasing it
        run: ./qm lint .

      - name: Package the Shipment source tree
        id: pkg
        run: |
          set -euo pipefail
          ASSET="${{ steps.v.outputs.name }}-v${{ steps.v.outputs.version }}.zip"
          FILES="manifest.yaml src README.md LICENSE"
          [ -d examples ] && FILES="$FILES examples"
          rm -f qm
          zip -r "$ASSET" $FILES -x 'build/*' '*/build/*'
          unzip -l "$ASSET" | grep -q 'manifest.yaml' || { echo "::error::asset is missing manifest.yaml"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Commit the stamp, tag it, and cut the release with the asset attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.yaml; then
            echo "manifest already at $VERSION — tagging the current commit"
          else
            git add manifest.yaml
            git commit -m "CI: stamp manifest version to $VERSION for release v$VERSION"
            git push origin "HEAD:$BRANCH"
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            --target "$(git rev-parse HEAD)" "$ASSET"

  guard-and-attach:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest.yaml version must equal the tag; read the Shipment name
        id: v
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(sed -n '/^shipment:/,/^contributions:/p' manifest.yaml \
            | sed -n 's/^[[:space:]]*version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1)
          if [ "$TAG" != "$MAN" ]; then
            echo "::error::tag v$TAG but manifest.yaml says $MAN. Use the dispatch path, or bump manifest.yaml to $TAG before tagging."
            exit 1
          fi
          NAME=$(sed -n '/^shipment:/,/^contributions:/p' manifest.yaml \
            | sed -n 's/^[[:space:]]*name:[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1)
          [ -n "$NAME" ] || { echo "::error::could not read shipment.name from manifest.yaml"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install qm (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          # Resolve "latest" to a concrete tag ONCE, so the digest we read and the bytes we download
          # come from the same release even if a newer qm publishes mid-run.
          tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
          [ -n "$tag" ] || { echo "::error::could not resolve the latest qm release"; exit 1; }
          # GitHub records a sha256 for every release asset. Read it before downloading, so the check
          # is against what the release claims to hold rather than against the bytes that arrived.
          want=$(gh api "repos/$repo/releases/tags/$tag" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          [ -n "$want" ] || { echo "::error::$asset is not in $tag"; exit 1; }
          want=${want#sha256:}
          gh release download "$tag" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "::error::$asset failed verification — expected $want, got $got"; exit 1; }
          echo "qm $tag verified: $got"
          chmod +x qm

      - name: Build the client ASI
        uses: ./.github/actions/build-asi

      - name: Lint the Shipment before releasing it
        run: ./qm lint .

      - name: Package the Shipment source tree
        id: pkg
        run: |
          set -euo pipefail
          ASSET="${{ steps.v.outputs.name }}-v${{ steps.v.outputs.version }}.zip"
          FILES="manifest.yaml src README.md LICENSE"
          [ -d examples ] && FILES="$FILES examples"
          rm -f qm
          zip -r "$ASSET" $FILES -x 'build/*' '*/build/*'
          unzip -l "$ASSET" | grep -q 'manifest.yaml' || { echo "::error::asset is missing manifest.yaml"; exit 1; }
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create the release if absent, or attach the asset to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSET="${{ steps.pkg.outputs.asset }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$ASSET"
          fi
