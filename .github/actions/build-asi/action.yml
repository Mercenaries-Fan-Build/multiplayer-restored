name: Build the client ASI
description: Builds src/multiplayer_restored.asi from client/ for i686-pc-windows-gnu, with the toolchain client/rust-toolchain.toml pins.

runs:
  using: composite
  steps:
    - name: Install the i686 MinGW linker
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686

    # The channel and target come from client/rust-toolchain.toml; build.rs refuses a libgcc fetched for
    # another rustc, so the version is pinned there and nowhere else.
    - name: Install the pinned Rust toolchain
      shell: bash
      working-directory: client
      run: |
        set -euo pipefail
        rustup toolchain install
        rustc -V

    - name: Fetch the DWARF-2 libgcc for that rustc
      shell: bash
      run: bash client/scripts/fetch_dw2_libgcc.sh

    # The ASI imports m2-sdk.dll; this fetches its import library for the release client/m2-sdk.version
    # names, verified against the sha256 GitHub records for the asset.
    - name: Fetch the m2-sdk import library
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash client/scripts/fetch_m2_sdk.sh

    - name: Build the ASI
      shell: bash
      run: bash client/scripts/build_asi.sh
